spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: product-service
              uri: http://product-service:8081
              predicates:
                - Path=/products/**

            - id: order-service
              uri: http://order-service:8082
              predicates:
                - Path=/orders/**

            - id: user-service
              uri: http://user-service:8083
              predicates:
                - Path=/users/**

server:
  port: 8090

management:
  endpoints:
    web:
      exposure:
        include: health,info
